# Omarchy for macOS - AeroSpace Configuration
# Glass Acrylic Tiling Desktop Suite for macOS

# Gaps configuration
[gaps]
inner.horizontal = 4
inner.vertical   = 4
outer.left       = 8
outer.bottom     = 8
outer.top        = 36 # Accounts for Sketchybar top height
outer.right      = 8

[mode.main.binding]
# Focus window
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'

# Window controls
alt-f = 'fullscreen'
alt-space = 'layout floating tiling'
alt-shift-q = 'close'

# Launchers
alt-exec-cmd = 'exec-and-forget open -a Terminal'
